[package]
name = "rooq"
version = "0.1.0"
edition = "2021"
authors = ["asong56"]
rust-version = "1.92"

[[bin]]
name = "rooq"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

tray-icon = "0.24.2"

eframe = { version = "0.33.0", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.33.0"

zune-core = "0.5.1"
zune-jpeg = "0.5.15"
zune-png = "0.5.2"
image = { version = "0.25.10", default-features = false, features = ["gif"] }

infer = "0.22.0"

mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts", "system-fonts"] }

chardetng = "1.0.0"
encoding_rs = "0.8.35"

syntastica = "0.6.1"
syntastica-parsers = { version = "0.6.1", features = ["some"] }
syntastica-themes = "0.6.1"

egui_commonmark = "0.22.0"

thiserror = "2.0.19"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
